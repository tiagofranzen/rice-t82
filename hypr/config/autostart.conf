exec-once = swww-daemon
# Clear stale IPC files so quickshell starts clean
exec-once = bash -c 'rm -f /tmp/qs_widget_state /tmp/qs_current_widget'
exec-once = bash -c 'WALL=$(cat ~/.cache/current_wallpaper 2>/dev/null); [ -f "$WALL" ] || WALL=~/Pictures/Wallpaper/mountain-forest.jpg; swww img "$WALL" --transition-type none; matugen image "$WALL" --source-color-index 0 --mode dark && pkill -USR1 kitty 2>/dev/null; true'
exec-once = bash -c 'GTK_THEME=Adwaita GDK_SCALE=1 swayosd-server'
exec-once = hypridle
exec-once = playerctld
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = easyeffects --gapplication-service
exec-once = ~/.config/hypr/scripts/settings_watcher.sh
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Main.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/TopBar.qml
exec-once = python3 ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py
exec-once = dunst
exec-once = /usr/libexec/hyprpolkitagent
# nm-tray removed: quickshell TopBar has its own network indicator
exec-once = bash -c "sleep 5 && amixer -c 0 sset 'WooferLeft PA' 12 && amixer -c 0 sset 'WooferRight PA' 12 && amixer -c 0 sset 'TweeterLeft PA' 12 && amixer -c 0 sset 'TweeterRight PA' 12 && amixer -c 0 sset 'stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8000"
