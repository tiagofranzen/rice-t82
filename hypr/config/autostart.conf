# Wallpaper daemon — swww keeps the last wallpaper across restarts
exec-once = swww-daemon
exec-once = bash -c 'WALL=$(cat ~/.cache/current_wallpaper 2>/dev/null); [ -f "$WALL" ] || WALL=~/Pictures/Wallpaper/mountain-forest.jpg; swww img "$WALL" --transition-type fade --transition-duration 1'

# Bar
exec-once = waybar

# Notifications
exec-once = dunst

# Auth agent
exec-once = /usr/libexec/hyprpolkitagent

# OSD overlay (volume/brightness feedback)
exec-once = bash -c 'GTK_THEME=Adwaita GDK_SCALE=1 swayosd-server'

# Idle/lock
exec-once = hypridle

# Media control daemon
exec-once = playerctld

# Clipboard history
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Audio (EasyEffects DSP)
exec-once = easyeffects --gapplication-service

# Cursor
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# Speaker tuning (Dell XPS 9345 — amp gains)
exec-once = bash -c "sleep 5 && amixer -c 0 sset 'WooferLeft PA' 12 && amixer -c 0 sset 'WooferRight PA' 12 && amixer -c 0 sset 'TweeterLeft PA' 12 && amixer -c 0 sset 'TweeterRight PA' 12 && amixer -c 0 sset 'stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8000"
