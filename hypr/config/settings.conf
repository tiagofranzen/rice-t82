#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 0
    gaps_in = 2
    gaps_out = 4
    resize_on_border = true
    extend_border_grab_area = 30
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 3
        passes = 1
        noise = 0.01
        contrast = 0.9
        brightness = 0.6
        xray = false
        new_optimizations = true
        ignore_opacity = false
    }
    shadow {
        enabled = false
    }
}

input {
    kb_layout = us,de
    kb_options = grp:alt_shift_toggle
    kb_variant =
    kb_model =
    kb_rules =

    # Mouse / pointer
    accel_profile = adaptive          # adaptive feels better than flat for touchpad
    sensitivity = 0.4                 # -1.0 to 1.0; 0.0 = default, 0.4 = noticeably faster

    touchpad {
        natural_scroll = true
        scroll_factor = 0.8           # slightly slower scroll than default (1.0) for precision
        tap-to-click = true           # tap = click, avoids pressing the pad down
        tap-and-drag = true           # tap then drag to move windows/select text
        drag_lock = true              # lift finger briefly during drag without dropping
        middle_button_emulation = false
        clickfinger_behavior = true   # 1-finger = left click, 2-finger = right click
        disable_while_typing = true   # suppress accidental touches while typing
    }
}

misc {
    focus_on_activate = true
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier, popin 80%
    animation = windowsOut, 1, 5, myBezier, popin 80%
    animation = layers, 1, 5, myBezier, fade
    animation = layersIn, 1, 5, myBezier, fade
    animation = layersOut, 1, 5, myBezier, fade
    animation = fade, 1, 5, myBezier
    animation = workspaces, 1, 5, myBezier, slide
    animation = specialWorkspaceIn, 1, 5, myBezier, fade
    animation = specialWorkspaceOut, 1, 5, myBezier, fade
}
