# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ SETTINGS  (rice2 — everforest / saatvik333 style)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = $borderSize
    gaps_in = $gapsIn
    gaps_out = $gapsOut
    resize_on_border = true
    no_focus_fallback = true
    layout = master

    col.active_border   = $active_border
    col.inactive_border = $inactive_border

    snap {
        enabled = true
    }
}

decoration {
    rounding = $rounding
    active_opacity   = $opacityActive
    inactive_opacity = $opacityInactive

    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.03
        vibrancy = 0
        xray = true
        popups = true
        blurls = waybar
    }

    shadow {
        enabled = false
    }
}

master {
    new_status = master
    mfact = $masterRatio
}

input {
    kb_layout = us,de
    kb_options = grp:alt_shift_toggle
    kb_variant =
    kb_model =
    kb_rules =

    accel_profile = adaptive
    sensitivity = 0.4

    touchpad {
        natural_scroll = true
        scroll_factor = 0.8
        tap-to-click = true
        tap-and-drag = true
        drag_lock = true
        middle_button_emulation = false
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_cancel_ratio = 0.3
}

misc {
    focus_on_activate = true
    font_family = $fontFamily
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    new_window_takes_over_fullscreen = 2
    allow_session_lock_restore = true
}

animations {
    enabled = true

    bezier = linear,   0,    0,    1,    1
    bezier = easeIn,   0.42, 0.0,  1,    1
    bezier = easeOut,  0.0,  0.0,  0.58, 1
    bezier = balanced, 0.2,  0,    0.3,  1
    bezier = smooth,   0.25, 0.1,  0.25, 1
    bezier = crisp,    0.3,  0,    0.4,  1
    bezier = flow,     0.15, 0,    0.35, 1

    animation = windows,              1, $animSpeed,     smooth
    animation = windowsIn,            1, $animSpeed,     balanced, slide
    animation = windowsOut,           1, $animSpeedFast, crisp,    slide
    animation = windowsMove,          1, $animSpeed,     flow
    animation = layers,               1, $animSpeedFast, balanced
    animation = layersIn,             1, $animSpeedFast, smooth,   slide
    animation = layersOut,            1, 1,              crisp,    slide
    animation = fadeLayers,           1, $animSpeedFast, smooth
    animation = border,               1, $animSpeed,     balanced
    animation = workspaces,           1, $animSpeed,     flow,     slide
    animation = specialWorkspaceIn,   1, $animSpeedFast, easeIn,   fade
    animation = specialWorkspaceOut,  1, $animSpeedFast, easeOut,  fade
}
