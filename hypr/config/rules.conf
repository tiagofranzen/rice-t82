#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Window rules
windowrule {
    name = float_app_launcher
    float = true
    center = true
    size = 1200 600
    match:title = ^(app-launcher)$
}

# File managers — subtle opacity and blur, keep tiling by default
windowrule {
    name = thunar_opacity
    opacity = 0.96 override 0.92 override
    match:class = ^(thunar|Thunar)$
}

# Yazi — floating terminal file manager
windowrule {
    name = yazi_float
    float = true
    center = true
    size = 1100 650
    opacity = 0.96 override 0.92 override
    match:class = ^(yazi-float)$
}

windowrule {
    name = firefox_opacity
    opacity = 0.65 override 0.65 override
    match:class = ^(firefox)$
}

# Waybar — blur behind the bar
layerrule = blur, waybar
layerrule = ignorezero, waybar
