# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS  (rice2)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse ─────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ───────── Gestures ─────────
gesture = 3, horizontal, workspace

# ───────── Applications ─────────
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D,      exec, $launcher
bind = $mainMod, F,      exec, $browser
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, T,      exec, Telegram
bind = $mainMod, O,      exec, obsidian

# File manager in terminal
bind = $mainMod SHIFT, E, exec, kitty --class=yazi-float --title=yazi --override initial_window_width=120c --override initial_window_height=35c yazi

# Clipboard (wofi dmenu)
bind = $mainMod, C, exec, cliphist list | wofi --dmenu -p "Clipboard" | cliphist decode | wl-copy

# ───────── Windows ─────────
bind  = ALT,          F4, exec, hyprctl dispatch killactive
bind  = $mainMod,     Q,  exec, hyprctl dispatch killactive
bind  = $mainMod SHIFT, F, togglefloating

# Snap / resize
bind = $mainMod, left,  exec, bash ~/.config/hypr/scripts/snap-window.sh left
bind = $mainMod, right, exec, bash ~/.config/hypr/scripts/snap-window.sh right
bind = $mainMod, up,    exec, bash ~/.config/hypr/scripts/snap-window.sh maximize
bind = $mainMod, down,  exec, bash ~/.config/hypr/scripts/snap-window.sh restore

# Focus
bind = $mainMod CTRL, left,  movefocus, l
bind = $mainMod CTRL, right, movefocus, r
bind = $mainMod CTRL, up,    movefocus, u
bind = $mainMod CTRL, down,  movefocus, d

# Move window to adjacent workspace
bind = $mainMod SHIFT, left,  movetoworkspace, r-1
bind = $mainMod SHIFT, right, movetoworkspace, r+1

# Master layout: swap master / rotate
bind = $mainMod CTRL, M, layoutmsg, swapwithmaster master
bind = $mainMod CTRL, R, layoutmsg, orientationnext

# ───────── Workspaces ─────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ───────── System ─────────
bind  = $mainMod,       L,      exec, bash ~/.config/hypr/scripts/lock.sh
bind  = $mainMod,       R,      exec, hyprctl reload
bind  = $mainMod,       P,      exec, wdisplays
bind  = $mainMod SHIFT, M,      exec, resources
bindl = , XF86PowerOff,         exec, bash ~/.config/hypr/scripts/lock.sh

# Screenshot
bindl = ,            Print, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = SHIFT,       Print, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = SUPER,       Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bindl = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit

# ───────── Media ─────────
bindl = $mainMod, SPACE,    exec, playerctl play-pause
bindl = , XF86AudioPlay,    exec, playerctl play-pause
bindl = , XF86AudioPause,   exec, playerctl play-pause

# ───────── Volume ─────────
bindl  = , xf86audiomute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , xf86AudioMicMute,     exec, swayosd-client --input-volume  mute-toggle
bindel = , xf86audiolowervolume,  exec, swayosd-client --output-volume lower
bindel = , xf86audioraisevolume,  exec, swayosd-client --output-volume raise
bindl  = , F1, exec, swayosd-client --output-volume mute-toggle
bindel = , F2, exec, swayosd-client --output-volume lower
bindel = , F3, exec, swayosd-client --output-volume raise
bindl  = , F4, exec, swayosd-client --input-volume  mute-toggle

# ───────── Brightness ─────────
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindl = , F7, exec, swayosd-client --brightness lower
bindl = , F8, exec, swayosd-client --brightness raise

# ───────── Caps Lock OSD ─────────
bindl = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock
