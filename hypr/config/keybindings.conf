#  ◈ KEYBINDINGS (Auto-generated by Quickshell Settings Watcher)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse & Gestures ─────────
gesture = 3, horizontal, workspace

# ───────── Dynamic Keybinds ─────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Windows-style snap (Super+Arrow)
bind = $mainMod, left, exec, bash ~/.config/hypr/scripts/snap-window.sh left
bind = $mainMod, right, exec, bash ~/.config/hypr/scripts/snap-window.sh right
bind = $mainMod, up, exec, bash ~/.config/hypr/scripts/snap-window.sh maximize
bind = $mainMod, down, exec, bash ~/.config/hypr/scripts/snap-window.sh restore

# Move window to adjacent workspace (Super+Shift+Arrow left/right)
bind = $mainMod&SHIFT_L, left, movetoworkspace, r-1
bind = $mainMod&SHIFT_L, right, movetoworkspace, r+1

# Move focus between windows (Super+Ctrl+Arrow)
bind = $mainMod&CTRL, left, movefocus, l
bind = $mainMod&CTRL, right, movefocus, r
bind = $mainMod&CTRL, up, movefocus, u
bind = $mainMod&CTRL, down, movefocus, d
bind = ALT, F4, exec, hyprctl dispatch killactive
bind = $mainMod&SHIFT_L, F, togglefloating
bindl = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
# F-key fallbacks for BIOS "Function key mode" (Dell XPS 13 9345 layout)
bindl = , F7, exec, swayosd-client --brightness lower
bindl = , F8, exec, swayosd-client --brightness raise
bindl = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = SUPER, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bindl = SUPER SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit
bindl = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/lock.sh
bindel = $mainMod, L, exec, bash ~/.config/hypr/scripts/lock.sh
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , xf86audiomute, exec, swayosd-client --output-volume mute-toggle
bindel = , xf86audiolowervolume, exec, swayosd-client --output-volume lower
bindel = , xf86audioraisevolume, exec, swayosd-client --output-volume raise
# F-key fallbacks for BIOS "Function key mode" (Dell XPS 13 9345 layout)
bindl = , F1, exec, swayosd-client --output-volume mute-toggle
bindel = , F2, exec, swayosd-client --output-volume lower
bindel = , F3, exec, swayosd-client --output-volume raise
bindl = , F4, exec, swayosd-client --input-volume mute-toggle
bind = $mainMod, D, exec, bash ~/.config/hypr/scripts/rofi_show.sh drun
bind = ALT, TAB, exec, bash ~/.config/hypr/scripts/rofi_show.sh window
bind = $mainMod, C, exec, bash ~/.config/hypr/scripts/rofi_clipboard.sh
bind = $mainMod, A, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle notifications
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, bash ~/.config/hypr/scripts/open-thunar.sh
bind = $mainMod&SHIFT_L, E, exec, kitty --class=yazi-float --title=yazi --override initial_window_width=120c --override initial_window_height=35c yazi
bind = $mainMod, T, exec, Telegram
bind = $mainMod, O, exec, obsidian
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = $mainMod, R, exec, bash ~/.config/hypr/scripts/reload.sh
bind = $mainMod&SHIFT_L, S, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle settings
bind = $mainMod, Q, exec, bash ~/.config/hypr/scripts/open-music.sh
bind = $mainMod&CTRL, Q, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = $mainMod, B, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle battery
bind = $mainMod, W, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = $mainMod, S, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = $mainMod, N, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = $mainMod SHIFT, N, exec, ~/.local/bin/networkmanager-dmenu
bind = $mainMod&SHIFT_L, T, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle focustime
bind = $mainMod, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle volume
bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle guide
bind = $mainMod&CTRL, B, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle stewart
