# ── Hyprlock — wallpaper-driven accent colors ──────────────
# Colors regenerated by matugen on wallpaper change
source = ~/.config/hypr/hyprlock-colors.conf

auth {
    fingerprint {
        enabled = true
        ready_message = Touch fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    monitor =
    color = rgba(0, 0, 0, 1)
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $hl_outline
    inner_color = $hl_surface
    font_color = $hl_on_surface
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $hl_on_surface
    font_size = 72
    font_family = JetBrains Mono Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $hl_outline
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 10
    halign = center
    valign = center
}
